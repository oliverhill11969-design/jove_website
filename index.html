<style>
  :root{
    --bg: #f5f2ea;
    --surface: #ffffff;
    --ink: #17150f;
    --ink-soft: #2a2620;
    --line: rgba(23,21,15,0.14);
    --muted: rgba(23,21,15,0.58);
    --ok: #4c7a4a;
    --warn: #b6812f;
    --bad: #b3453f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; line-height:1.5;
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0; }
  .wrap{ max-width:960px; margin:0 auto; padding:32px 20px 80px; }
  header.top{
    display:flex; justify-content:space-between; align-items:center;
    padding:20px 0; border-bottom:1px solid var(--line); margin-bottom:32px;
  }
  header.top .brand{ display:flex; align-items:center; gap:10px; }
  header.top .brand img{ height:28px; width:auto; display:block; }
  header.top .brand span{ font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; letter-spacing:2px; }
  header.top .who{ font-size:14px; color:var(--muted); display:flex; gap:12px; align-items:center; }
  button, select, input, textarea{ font-family:inherit; font-size:15px; }
  button{
    background:var(--ink); color:var(--bg); border:none; padding:10px 16px;
    border-radius:3px; font-weight:600; cursor:pointer;
  }
  button.ghost{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  button.small{ padding:6px 10px; font-size:13px; }
  button:disabled{ opacity:.4; cursor:not-allowed; }

  .login-card{
    max-width:400px; margin:80px auto; background:var(--surface);
    border:1px solid var(--line); border-radius:6px; padding:32px; text-align:center;
  }
  .login-card .logo{ height:56px; width:auto; margin-bottom:18px; }
  .login-card h2{ font-size:22px; margin-bottom:6px; letter-spacing:2px; }
  .login-card p{ color:var(--muted); margin:0 0 20px; font-size:14px;}
  .field{ margin-bottom:14px; text-align:left; }
  .field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--line);
    color:var(--ink); padding:9px 10px; border-radius:4px;
  }
  .field textarea{ resize:vertical; min-height:64px; }

  section{ margin-bottom:44px; }
  section > h2{ font-size:19px; margin-bottom:4px; letter-spacing:.3px; }
  section > .hint{ color:var(--muted); font-size:13px; margin-bottom:18px; }

  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:160px; }

  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.4px; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px; }

  .products-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .product{ background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px; }
  .product h3{ font-size:16px; margin-bottom:4px; }
  .product .desc{ color:var(--muted); font-size:13px; }
  .product .price{ color:var(--ink); font-weight:700; margin-top:8px; }
  .product .need-toggle{ margin-top:12px; width:100%; }
  .need-form{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .need-form .field{ margin-bottom:10px; }
  .need-form input{ font-size:14px; padding:7px 9px; }

  .empty{ color:var(--muted); font-size:14px; padding:24px; text-align:center; border:1px dashed var(--line); border-radius:6px; }
  .actions{ display:flex; gap:6px; flex-wrap:wrap; }
  footer.note{ margin-top:40px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:12px 22px; border-radius:6px;
    font-weight:600; font-size:14px; box-shadow:0 8px 20px rgba(0,0,0,.25);
    z-index:50;
  }

  @media (max-width: 640px){
    .wrap{ padding:20px 14px 60px; }
    header.top{ flex-direction:column; align-items:flex-start; gap:10px; }
    header.top .who{ flex-wrap:wrap; }
    .row{ flex-direction:column; }
    .row > .field{ min-width:0; }
    .products-grid{ grid-template-columns:1fr; }
    table{ font-size:13px; }
    th, td{ padding:8px 6px; }
    .card{ padding:16px; }
    .toast{ left:16px; right:16px; transform:none; text-align:center; }
  }
</style>
</head>

const ADMIN_EMAIL = "info@jove.ch"; // <- hier deine echte E-Mail-Adresse eintragen

// --- EmailJS Konfiguration ---
// 1. Kostenloses Konto auf https://www.emailjs.com erstellen
// 2. Einen "Email Service" verbinden (z.B. Gmail) -> ergibt SERVICE_ID
// 3. Ein "Emaix`l Template" erstellen mit den Variablen: product_name, amount, purpose, employee_name, employee_email -> ergibt TEMPLATE_ID
// 4. Den "Public Key" unter Account -> General kopieren -> ergibt PUBLIC_KEY
const EMAILJS_PUBLIC_KEY  = "DEIN_PUBLIC_KEY";
const EMAILJS_SERVICE_ID  = "DEIN_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "DEIN_TEMPLATE_ID";
const EMAILJS_READY = EMAILJS_PUBLIC_KEY !== "DEIN_PUBLIC_KEY" && window.emailjs;
if(EMAILJS_READY){ emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); }

let toastMessage = null;
let toastTimer = null;
function showToast(msg){
  toastMessage = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastMessage = null; render(); }, 2200);
}

function openMailto(to, subject, body){
  const a = document.createElement('a');
  a.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  a.click();
}

function sendNeedEmail(product, amount, purpose, email, byName){
  if(EMAILJS_READY){
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: ADMIN_EMAIL,
      product_name: product.name,
      amount, purpose,
      employee_name: byName,
      employee_email: email
    }).then(() => {
      showToast('Bedarf gemeldet — E-Mail verschickt!');
    }).catch(err => {
      console.error('EmailJS Fehler:', err);
      showToast('Bedarf gespeichert, E-Mail-Versand fehlgeschlagen.');
    });
  } else {
    // Fallback, solange EmailJS oben noch nicht mit echten IDs eingerichtet ist
    openMailto(
      ADMIN_EMAIL,
      `Bedarf gemeldet: ${product.name}`,
      `Produkt: ${product.name}\nMenge/was genau: ${amount}\nFür: ${purpose}\nGemeldet von: ${byName}\nE-Mail-Adresse: ${email}`
    );
    showToast('Bedarf gemeldet — E-Mail-Entwurf geöffnet (EmailJS noch nicht eingerichtet).');
  }
}

// --- Passwort-Sicherheit ---
// Passwörter werden nie im Klartext gespeichert, sondern als SHA-256 Hash.
async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function looksHashed(pw){
  return typeof pw === 'string' && /^[0-9a-f]{64}$/i.test(pw);
}
async function migratePasswords(){
  let changed = false;
  for(const e of state.employees){
    if(!looksHashed(e.password)){
      e.password = await hashPassword(e.password || '');
      changed = true;
    }
  }
  if(changed) saveState();
}

function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function loadState(){
  const raw = localStorage.getItem(STORE_KEY);
  let data = null;
  if(raw){ try { data = JSON.parse(raw); } catch(e){ data = null; } }
  if(!data){
    data = {
      employees: [{id: crypto.randomUUID(), name:"Oliver", role:"admin", password:"admin"}],
      products: [],
      requests: [],
      currentUserId: null,
      openNeedFormFor: null
    };
  }
  if(!Array.isArray(data.employees)) data.employees = [];
  if(!Array.isArray(data.products)) data.products = [];
  if(!Array.isArray(data.requests)) data.requests = [];
  if(typeof data.currentUserId === 'undefined') data.currentUserId = null;
  if(typeof data.openNeedFormFor === 'undefined') data.openNeedFormFor = null;
  if(typeof data.openEditFor === 'undefined') data.openEditFor = null;
  if(data.employees.length === 0){
    data.employees.push({id: crypto.randomUUID(), name:"Oliver", role:"admin", password:"admin"});
  }
  data.employees.forEach(e => { if(typeof e.password === 'undefined') e.password = ''; });
  return data;
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState();

function currentUser(){
  return state.employees.find(e => e.id === state.currentUserId) || null;
}

function render(){
  const app = document.getElementById('app');
  const user = currentUser();
  if(!user){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  app.innerHTML = renderApp(user);
  attachAppEvents(user);
}

function renderLogin(){
  const options = state.employees.map(e =>
    `<option value="${e.id}">${escapeHtml(e.name)} (${e.role === 'admin' ? 'Admin' : 'Mitarbeiter'})</option>`
  ).join('');
  return `
    <div class="login-card">
      <img class="logo" src="${LOGO_SRC}" alt="Jøve Logo">
      <h2>JØVE</h2>
      <p>Produktverwaltung — bitte anmelden (Admin-Start: Oliver / admin)</p>
      <div class="field">
        <label>Name</label>
        <select id="login-select">${options}</select>
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="login-pw" placeholder="Passwort">
      </div>
      <div id="login-error" style="color:#e08a8a; font-size:13px; margin-bottom:10px; display:none;">Falsches Passwort.</div>
      <button id="login-btn" style="width:100%">Anmelden</button>
    </div>
  `;
}

function attachLoginEvents(){
  document.getElementById('login-btn').onclick = async () => {
    const id = document.getElementById('login-select').value;
    const pw = document.getElementById('login-pw').value;
    const emp = state.employees.find(e => e.id === id);
    const hashed = await hashPassword(pw);
    if(!emp || emp.password !== hashed){
      document.getElementById('login-error').style.display = 'block';
      return;
    }
    state.currentUserId = id;
    saveState(); render();
  };
}

function renderApp(user){
  const isAdmin = user.role === 'admin';
  return `
    <header class="top">
      <div class="brand"><img src="${LOGO_SRC}" alt="Jøve Logo"><span>JØVE</span></div>
      <div class="who">
        Angemeldet als <strong>${escapeHtml(user.name)}</strong> · ${isAdmin ? 'Admin' : 'Mitarbeiter'}
        <button class="ghost small" id="logout-btn">Abmelden</button>
      </div>
    </header>

    ${isAdmin ? renderAdminEmployees() : ''}
    ${renderChangePassword(user)}
    ${isAdmin ? renderAdminAddProduct() : ''}
    ${renderProducts(user)}
    ${isAdmin ? renderRequestsTable() : ''}

    <footer class="note">
      Prototyp — Daten werden lokal in diesem Browser gespeichert (localStorage), noch nicht zwischen Geräten geteilt.
    </footer>
    ${toastMessage ? `<div class="toast">${escapeHtml(toastMessage)}</div>` : ''}
  `;
}

function renderAdminEmployees(){
  const rows = state.employees.map(e => `
    <tr>
      <td>${escapeHtml(e.name)}</td>
      <td>${e.role === 'admin' ? 'Admin' : 'Mitarbeiter'}</td>
      <td>
        ${e.role !== 'admin' ? `<button class="ghost small" data-remove-emp="${e.id}">Entfernen</button>` : ''}
      </td>
    </tr>
  `).join('');
  return `
  <section>
    <h2>Mitarbeiter</h2>
    <div class="hint">Mitarbeiter hinzufügen, damit sie sich anmelden und Bedarf melden können.</div>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Rolle</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="row" style="margin-top:16px;">
        <div class="field"><label>Name</label><input id="new-emp-name" placeholder="z.B. Julia"></div>
        <div class="field"><label>Passwort</label><input id="new-emp-pw" placeholder="Startpasswort"></div>
        <div style="align-self:flex-end;"><button id="add-emp-btn">Hinzufügen</button></div>
      </div>
    </div>
  </section>`;
}

function renderChangePassword(user){
  return `
  <section>
    <h2>Passwort ändern</h2>
    <div class="hint">Nur du siehst diesen Bereich für dein eigenes Konto.</div>
    <div class="card">
      <div class="row">
        <div class="field"><label>Neues Passwort</label><input type="password" id="new-pw" placeholder="Neues Passwort"></div>
        <div style="align-self:flex-end;"><button id="change-pw-btn">Ändern</button></div>
      </div>
    </div>
  </section>`;
}

function renderAdminAddProduct(){
  return `
  <section>
    <h2>Produkt auflisten</h2>
    <div class="hint">Trage ein Produkt für die Website ein.</div>
    <div class="card">
      <div class="row">
        <div class="field"><label>Produktname</label><input id="p-name" placeholder="z.B. Produktname"></div>
        <div class="field"><label>Preis (CHF)</label><input id="p-price" placeholder="z.B. 4.50"></div>
      </div>
      <div class="field"><label>Beschreibung</label><textarea id="p-desc" placeholder="Kurze Beschreibung..."></textarea></div>
      <button id="p-submit-btn">Auflisten</button>
    </div>
  </section>`;
}

function renderProducts(user){
  const isAdmin = user.role === 'admin';
  if(state.products.length === 0){
    return `<section><h2>Produkte</h2><div class="empty">Noch keine Produkte aufgelistet.</div></section>`;
  }
  const cards = state.products.map(p => {
    const needFormOpen = state.openNeedFormFor === p.id;
    const editOpen = state.openEditFor === p.id;
    return `
      <div class="product">
        ${editOpen ? `
          <div class="field"><label>Produktname</label><input id="edit-name-${p.id}" value="${escapeHtml(p.name)}"></div>
          <div class="field"><label>Preis (CHF)</label><input id="edit-price-${p.id}" value="${escapeHtml(p.price||'')}"></div>
          <div class="field"><label>Beschreibung</label><textarea id="edit-desc-${p.id}">${escapeHtml(p.desc||'')}</textarea></div>
          <div class="actions">
            <button class="small" data-save-edit="${p.id}">Speichern</button>
            <button class="ghost small" data-toggle-edit="${p.id}">Abbrechen</button>
          </div>
        ` : `
          <h3>${escapeHtml(p.name)}</h3>
          <div class="desc">${escapeHtml(p.desc||'')}</div>
          ${p.price ? `<div class="price">CHF ${escapeHtml(p.price)}</div>` : ''}
          ${isAdmin ? `
            <div class="actions" style="margin-top:10px;">
              <button class="ghost small" data-toggle-edit="${p.id}">Bearbeiten</button>
              <button class="ghost small" data-remove-product="${p.id}">Entfernen</button>
            </div>
          ` : ''}
          <button class="ghost need-toggle small" data-toggle-need="${p.id}">${needFormOpen ? 'Abbrechen' : 'Ich brauche...'}</button>
        `}
        ${needFormOpen ? `
          <div class="need-form">
            <div class="field"><label>Menge / was genau</label><input id="need-amount-${p.id}" placeholder="z.B. 2 Fässer"></div>
            <div class="field"><label>Für</label><input id="need-purpose-${p.id}" placeholder="z.B. Event am Samstag"></div>
            <div class="field"><label>E-Mail-Adresse</label><input id="need-email-${p.id}" placeholder="name@jove.ch"></div>
            <button data-submit-need="${p.id}">Bedarf melden</button>
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
  return `
  <section>
    <h2>Produkte</h2>
    <div class="products-grid">${cards}</div>
  </section>`;
}

function renderRequestsTable(){
  if(!state.requests.length){
    return `<section><h2>Gemeldeter Bedarf</h2><div class="empty">Noch keine Meldungen.</div></section>`;
  }
  const rows = state.requests.map(r => `
    <tr>
      <td>${escapeHtml(r.productName)}</td>
      <td>${escapeHtml(r.amount)}</td>
      <td>${escapeHtml(r.purpose)}</td>
      <td>${escapeHtml(r.email)}</td>
      <td>${escapeHtml(r.by)}</td>
      <td><button class="ghost small" data-remove-req="${r.id}">Erledigt</button></td>
    </tr>
  `).join('');
  return `
  <section>
    <h2>Gemeldeter Bedarf</h2>
    <div class="card">
      <table>
        <thead><tr><th>Produkt</th><th>Menge</th><th>Für</th><th>E-Mail</th><th>Von</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>`;
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function attachAppEvents(user){
  const logout = document.getElementById('logout-btn');
  if(logout) logout.onclick = () => { state.currentUserId = null; saveState(); render(); };

  const addEmpBtn = document.getElementById('add-emp-btn');
  if(addEmpBtn) addEmpBtn.onclick = async () => {
    const name = document.getElementById('new-emp-name').value.trim();
    const pw = document.getElementById('new-emp-pw').value.trim();
    if(!name || !pw) return;
    const hashed = await hashPassword(pw);
    state.employees.push({id: crypto.randomUUID(), name, role:'employee', password: hashed});
    saveState(); showToast('Mitarbeiter hinzugefügt!');
  };

  document.querySelectorAll('[data-remove-emp]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-remove-emp');
      state.employees = state.employees.filter(e => e.id !== id);
      saveState(); showToast('Mitarbeiter entfernt.');
    };
  });

  const changePwBtn = document.getElementById('change-pw-btn');
  if(changePwBtn) changePwBtn.onclick = async () => {
    const pw = document.getElementById('new-pw').value.trim();
    if(!pw) return;
    const hashed = await hashPassword(pw);
    state.employees = state.employees.map(e => e.id === user.id ? {...e, password: hashed} : e);
    saveState(); showToast('Passwort geändert!');
  };

  const submitBtn = document.getElementById('p-submit-btn');
  if(submitBtn) submitBtn.onclick = () => {
    const name = document.getElementById('p-name').value.trim();
    if(!name) return;
    state.products.push({
      id: crypto.randomUUID(),
      name,
      price: document.getElementById('p-price').value.trim(),
      desc: document.getElementById('p-desc').value.trim()
    });
    saveState(); showToast('Produkt aufgelistet!');
  };

  document.querySelectorAll('[data-remove-product]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-remove-product');
      state.products = state.products.filter(p => p.id !== id);
      saveState(); showToast('Produkt entfernt.');
    };
  });

  document.querySelectorAll('[data-toggle-edit]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-toggle-edit');
      state.openEditFor = state.openEditFor === id ? null : id;
      render();
    };
  });

  document.querySelectorAll('[data-save-edit]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-save-edit');
      const name = document.getElementById(`edit-name-${id}`).value.trim();
      if(!name) return;
      const price = document.getElementById(`edit-price-${id}`).value.trim();
      const desc = document.getElementById(`edit-desc-${id}`).value.trim();
      state.products = state.products.map(p => p.id === id ? {...p, name, price, desc} : p);
      state.openEditFor = null;
      saveState(); showToast('Produkt aktualisiert!');
    };
  });

  document.querySelectorAll('[data-toggle-need]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-toggle-need');
      state.openNeedFormFor = state.openNeedFormFor === id ? null : id;
      render();
    };
  });

  document.querySelectorAll('[data-submit-need]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-submit-need');
      const product = state.products.find(p => p.id === id);
      if(!product) return;
      const amount = document.getElementById(`need-amount-${id}`).value.trim();
      const purpose = document.getElementById(`need-purpose-${id}`).value.trim();
      const email = document.getElementById(`need-email-${id}`).value.trim();
      if(!amount) return;
      if(email && !isValidEmail(email)){
        showToast('Bitte eine gültige E-Mail-Adresse eingeben.');
        return;
      }
      state.requests.push({
        id: crypto.randomUUID(),
        productId: id,
        productName: product.name,
        amount, purpose, email,
        by: user.name, byId: user.id
      });
      state.openNeedFormFor = null;
      saveState();
      render();
      sendNeedEmail(product, amount, purpose, email, user.name);
    };
  });

  document.querySelectorAll('[data-remove-req]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-remove-req');
      state.requests = state.requests.filter(r => r.id !== id);
      saveState(); showToast('Erledigt markiert.');
    };
  });
}

(async function init(){
  await migratePasswords();
  render();
})();
</script>
</body>
</html>
